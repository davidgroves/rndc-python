name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv sync --extra test

      - run: uv run pytest -m "not integration"

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
